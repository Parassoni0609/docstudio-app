<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="primaryFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Central "DS" Unified Tech Monogram -->
  <g transform="translate(64, 80)" filter="url(#softGlow)">
    <!-- Back Glow Silhouette -->
    <path
      d="M60 40 
         H180 
         C260 40 310 80 310 140 
         C310 195 265 230 200 240
         C265 250 315 285 315 345 
         C315 410 260 450 170 450
         H60 
         Z"
      fill="none"
      stroke="url(#primaryFlow)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.15"
    />

    <!-- The 'D' Spine & Outer Arc -->
    <path
      d="M70 50 
         L70 430 
         C70 430 190 430 220 370 
         C245 320 225 255 170 240
         C235 230 250 160 215 105
         C185 55 70 50 70 50 Z"
      fill="none"
      stroke="url(#primaryFlow)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Intersecting 'S' Dynamic Sweep -->
    <path
      d="M260 115 
         C235 75 190 60 150 60 
         C110 60 80 85 80 120 
         C80 165 140 185 190 205 
         C250 230 295 260 295 320 
         C295 385 240 425 170 425 
         C120 425 80 400 65 365"
      fill="none"
      stroke="url(#accentGlow)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Accent Node Points (Research Studio Anchors) -->
    <circle cx="260" cy="115" r="10" fill="#38bdf8" />
    <circle cx="170" cy="240" r="11" fill="url(#goldAccent)" />
    <circle cx="65" cy="365" r="10" fill="#a855f7" />
  </g>
</svg>
